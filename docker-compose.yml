# Production stack: Caddy (HTTPS) -> app (API + WebSocket + tracker gateway) -> PostgreSQL/TimescaleDB.
#   docker compose up -d --build
#
# Public ports: 80/443 (Caddy), 5023 (trackers). The API port 3000 and the
# database are only reachable from this machine.
#
# Local development with `npm run dev`: start only the database with
#   docker compose up -d db
x-logging: &logging
  # Rotate container logs so they can't fill the disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker, the database is reachable by its service name.
      DATABASE_URL: postgresql://gps:${POSTGRES_PASSWORD:-gps_dev_password}@db:5432/gps
      NODE_ENV: production
      TRUST_PROXY: 1   # requests come through Caddy; use X-Forwarded-For for client IPs
    ports:
      - "5023:5023"             # GT06N devices connect here (public)
      - "127.0.0.1:3000:3000"   # API without HTTPS: this machine only (admin tools, debugging)
    volumes:
      # Firebase service-account key for push notifications (secrets/firebase.json).
      # Optional: without it push is disabled and everything else works.
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 20s   # time to flush buffered positions on shutdown
    logging: *logging

  db:
    image: timescale/timescaledb:2.30.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gps_dev_password}
      POSTGRES_DB: gps
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost only: reachable from this machine (for `npm run dev`
      # and admin tools), never from the internet.
      - "127.0.0.1:${DB_HOST_PORT:-5440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gps -d gps"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates (keep this volume!)
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
